name: Build Chronological No-Oak Pokemon Blue Battle Hub

on:
  push:
    branches: [main]
    paths:
      - 'build/patch_battlehub.py'
      - 'build/patch_battlehub_clean_freeorder.py'
      - 'build/patch_battlehub_chrono_nooak.py'
      - '.github/workflows/build-battlehub-chrono-nooak.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout build helpers
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential git make gcc pkg-config flex bison libpng-dev

      - name: Build and verify vanilla Pokemon Blue
        run: |
          git clone --depth=1 https://github.com/pret/pokered.git vanilla
          git clone --depth=1 --branch v1.0.3 https://github.com/gbdev/rgbds.git rgbds-new
          sudo make -C rgbds-new -j$(nproc) install
          make -C vanilla -j$(nproc) blue
          test "$(sha1sum vanilla/pokeblue.gbc | awk '{print $1}')" = "d7037c83e1ae5b39bde3c30787637ba1d4c48ce2"

      - name: Install RGBDS 0.4.1 for custom-starter source
        run: |
          git clone --depth=1 --branch v0.4.1 https://github.com/gbdev/rgbds.git rgbds-old
          sudo make -C rgbds-old -j$(nproc) install

      - name: Build chronological no-Oak Battle Hub
        run: |
          git clone --depth=1 https://github.com/UnderscorePoY/pokered-custom-starter.git hack
          python3 build/patch_battlehub_chrono_nooak.py hack

          # Reuse a spare current-script byte for this custom map.
          sed -i 's/wIndigoPlateauLobbyCurScript/wRoute3CurScript/g' hack/scripts/IndigoPlateauLobby.asm

          # Keep blackout recovery inside the hub.
          python3 - <<'PY'
          from pathlib import Path

          p = Path('hack/scripts/IndigoPlateauLobby.asm')
          s = p.read_text()
          old = 'IndigoPlateauLobby_Script:\n\tcall EnableAutoTextBoxDrawing'
          new = 'IndigoPlateauLobby_Script:\n\tld a, INDIGO_PLATEAU_LOBBY\n\tld [wLastBlackoutMap], a\n\tcall EnableAutoTextBoxDrawing'
          if old not in s:
              raise SystemExit('hub blackout insertion point missing')
          p.write_text(s.replace(old, new, 1))

          p = Path('hack/engine/overworld/special_warps.asm')
          s = p.read_text()
          old = '\tld a, [wLastBlackoutMap]\n\tjr .usedFlyWarp'
          new = '\tld a, [wLastBlackoutMap]\n\tcp INDIGO_PLATEAU_LOBBY\n\tjr nz, .usedFlyWarp\n\tld hl, FirstMapSpec\n\tjr .copyWarpData'
          if old not in s:
              raise SystemExit('blackout warp insertion point missing')
          p.write_text(s.replace(old, new, 1))
          PY

          make -C hack -j$(nproc) blue
          test -f hack/pokeblue.gbc
          test "$(stat -c%s hack/pokeblue.gbc)" = "1048576"

      - name: Generate IPS patch and checksums
        run: |
          mkdir -p output
          python3 - <<'PY'
          from pathlib import Path
          src = Path('vanilla/pokeblue.gbc').read_bytes()
          dst = Path('hack/pokeblue.gbc').read_bytes()
          assert len(src) == len(dst) == 1048576
          out = bytearray(b'PATCH')
          i = 0
          while i < len(src):
              if src[i] == dst[i]:
                  i += 1
                  continue
              start = i
              chunk = bytearray()
              while i < len(src) and src[i] != dst[i] and len(chunk) < 65535:
                  chunk.append(dst[i])
                  i += 1
              out += start.to_bytes(3, 'big')
              out += len(chunk).to_bytes(2, 'big')
              out += chunk
          out += b'EOF'
          Path('output/PokemonBlue_BattleHub_Chronological_NoOak.ips').write_bytes(out)
          PY
          {
            echo "source_sha1=d7037c83e1ae5b39bde3c30787637ba1d4c48ce2"
            echo "target_sha1=$(sha1sum hack/pokeblue.gbc | awk '{print $1}')"
            echo "target_sha256=$(sha256sum hack/pokeblue.gbc | awk '{print $1}')"
            echo "target_size=$(stat -c%s hack/pokeblue.gbc)"
            echo "patch_sha256=$(sha256sum output/PokemonBlue_BattleHub_Chronological_NoOak.ips | awk '{print $1}')"
          } > output/build-info.txt
          cat output/build-info.txt

      - name: Upload patch artifact
        uses: actions/upload-artifact@v4
        with:
          name: PokemonBlue-BattleHub-Chronological-NoOak-Patch
          path: |
            output/PokemonBlue_BattleHub_Chronological_NoOak.ips
            output/build-info.txt
