name: Build Future Kanto League Pokemon Blue Battle Hub
on:
  push:
    branches: [main]
    paths: ['build/patch_battlehub_future_league_v2.py','.github/workflows/build-battlehub-future-league.yml']
  workflow_dispatch:
permissions: {contents: read}
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y build-essential git make gcc pkg-config flex bison libpng-dev
      - name: Build verified vanilla Blue
        run: |
          git clone --depth=1 https://github.com/pret/pokered.git vanilla
          git clone --depth=1 --branch v1.0.3 https://github.com/gbdev/rgbds.git rgbds-new
          sudo make -C rgbds-new -j$(nproc) install
          make -C vanilla -j$(nproc) blue
          test "$(sha1sum vanilla/pokeblue.gbc | awk '{print $1}')" = "d7037c83e1ae5b39bde3c30787637ba1d4c48ce2"
      - run: |
          git clone --depth=1 --branch v0.4.1 https://github.com/gbdev/rgbds.git rgbds-old
          sudo make -C rgbds-old -j$(nproc) install
      - name: Build Future League hub
        run: |
          git clone --depth=1 https://github.com/UnderscorePoY/pokered-custom-starter.git hack
          python3 build/patch_battlehub_future_league_v2.py hack
          sed -i 's/wIndigoPlateauLobbyCurScript/wRoute3CurScript/g' hack/scripts/IndigoPlateauLobby.asm
          python3 - <<'PY'
          from pathlib import Path
          p=Path('hack/scripts/IndigoPlateauLobby.asm');s=p.read_text();old='IndigoPlateauLobby_Script:\n\tcall EnableAutoTextBoxDrawing';new='IndigoPlateauLobby_Script:\n\tld a, INDIGO_PLATEAU_LOBBY\n\tld [wLastBlackoutMap], a\n\tcall EnableAutoTextBoxDrawing';p.write_text(s.replace(old,new,1))
          p=Path('hack/engine/overworld/special_warps.asm');s=p.read_text();old='\tld a, [wLastBlackoutMap]\n\tjr .usedFlyWarp';new='\tld a, [wLastBlackoutMap]\n\tcp INDIGO_PLATEAU_LOBBY\n\tjr nz, .usedFlyWarp\n\tld hl, FirstMapSpec\n\tjr .copyWarpData';p.write_text(s.replace(old,new,1))
          PY
          make -C hack -j$(nproc) blue
          test "$(stat -c%s hack/pokeblue.gbc)" = "1048576"
      - name: Generate IPS and checksums
        run: |
          mkdir -p output
          python3 - <<'PY'
          from pathlib import Path
          src=Path('vanilla/pokeblue.gbc').read_bytes();dst=Path('hack/pokeblue.gbc').read_bytes();out=bytearray(b'PATCH');i=0
          while i<len(src):
            if src[i]==dst[i]: i+=1;continue
            st=i;c=bytearray()
            while i<len(src) and src[i]!=dst[i] and len(c)<65535:c.append(dst[i]);i+=1
            out+=st.to_bytes(3,'big')+len(c).to_bytes(2,'big')+c
          Path('output/PokemonBlue_BattleHub_FutureLeague.ips').write_bytes(out+b'EOF')
          PY
          echo source_sha1=d7037c83e1ae5b39bde3c30787637ba1d4c48ce2 > output/build-info.txt
          echo target_sha1=$(sha1sum hack/pokeblue.gbc|awk '{print $1}') >> output/build-info.txt
          echo target_sha256=$(sha256sum hack/pokeblue.gbc|awk '{print $1}') >> output/build-info.txt
          echo target_size=$(stat -c%s hack/pokeblue.gbc) >> output/build-info.txt
          echo patch_sha256=$(sha256sum output/PokemonBlue_BattleHub_FutureLeague.ips|awk '{print $1}') >> output/build-info.txt
      - uses: actions/upload-artifact@v4
        with:
          name: PokemonBlue-BattleHub-FutureLeague-Patch
          path: output/
